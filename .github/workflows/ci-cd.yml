name: NextBazaar CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      # 1. কোড Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3. Dependencies ইন্সটল
      - name: Install dependencies
        run: npm ci

      # 4. Lint চালানো (যদি থাকে)
      - name: Run Linter
        run: npm run lint --if-present

      # 5. TypeScript চেক (যদি থাকে)
      - name: Run Type Check
        run: npm run type-check --if-present

      # 6. React Tests চালানো
      - name: Run Tests
        run: npm test -- --ci --coverage

      # 7. Next.js Build
      - name: Build project
        run: npm run build

  deploy:
    needs: test_and_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # কোড Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # Node.js সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # Dependencies ইন্সটল
      - name: Install dependencies
        run: npm ci

      # Next.js Build
      - name: Build project
        run: npm run build

