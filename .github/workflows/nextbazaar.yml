name: NextBazaar CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # 3️⃣ Install deps
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint
      - name: Run Linter
        run: npm run lint --if-present

      # 5️⃣ TypeScript
      - name: Run Type Check
        run: npm run type-check --if-present

      # 6️⃣ Unit & Integration Tests (Jest)
      - name: Run Jest Tests
        run: npm test -- --ci --coverage

      # 7️⃣ Upload test coverage to Codecov (optional but recommended)
      # - name: Upload Coverage Report
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: ./coverage/lcov.info
      #     fail_ci_if_error: false

      # 8️⃣ Build Project (Next.js)
      - name: Build project
        run: npm run build

      # 9️⃣ End-to-End Tests (Playwright)
      - name: Run Playwright Tests
        run: |
          # Install Playwright dependencies
          npx playwright install --with-deps

          # Start the Next.js server and capture its PID
          npm run start & echo $! > .nextserver.pid

          # Wait for the server to be ready
          npx wait-on tcp:3000

          # Run E2E tests
          npm run test:e2e

          # Stop the server using the saved PID
          kill $(cat .nextserver.pid) || pkill -f "npm run start" || true
        env:
          BASE_URL: http://localhost:3000

  deploy:
    name: Deploy to Vercel
    needs: test_and_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

